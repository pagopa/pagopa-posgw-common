name: Deploy Maven artifacts
description: "Build and deploy Maven artifacts to GitHub Packages with Gradle"

inputs:
  github_token:
    required: true
    description: The github token used to publish artifact

runs:
  using: "composite"
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@0ab4596768b603586c0de567f2430c30f5b0d2b0 # v3
      with:
        java-version: '25'
        distribution: 'corretto'
        cache: 'gradle'
    - name: Deploy to GitHub Package Registry
      shell: bash
      run: ./gradlew publish
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ inputs.github_token }}