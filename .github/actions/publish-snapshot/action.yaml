name: Deploy snapshot Maven artifacts
description: "Build and deploy snapshot Maven artifacts to GitHub Packages with Gradle"

inputs:
  github_token:
    required: true
    description: The github token used to publish artifact
  branch_name:
    required: true
    description: The branch name used to generate snapshot version

runs:
  using: "composite"
  steps:
    - name: Guard against main branch
      if: ${{ inputs.branch_name == 'main' }}
      shell: bash
      run: |
        echo "::error::This action must not run on main branch"
        exit 1
    - name: Set up JDK 25
      uses: actions/setup-java@0ab4596768b603586c0de567f2430c30f5b0d2b0 # v3
      with:
        java-version: '25'
        distribution: 'corretto'
        cache: 'gradle'
    - name: Compute snapshot version
      shell: bash
      env:
        BRANCH_NAME: ${{ inputs.branch_name }}
      run: |
        CURRENT_VERSION=$(
          ./gradlew properties --property version --quiet |
            sed -n 's/^version: //p'
        )
        if [[ -z "${CURRENT_VERSION}" ]]; then
          echo "::error::Could not determine the project version"
          exit 1
        fi
        echo "Current version: ${CURRENT_VERSION}"
        BRANCH=$(echo "${BRANCH_NAME}" | sed 's/[^a-zA-Z0-9-]/-/g')
        COMMIT_ID=$(git rev-parse --short HEAD)
        SNAPSHOT_VERSION="${CURRENT_VERSION}-${BRANCH}-${COMMIT_ID}-SNAPSHOT"
        echo "Snapshot version: ${SNAPSHOT_VERSION}"
        echo "SNAPSHOT_VERSION=${SNAPSHOT_VERSION}" >> "${GITHUB_ENV}"

    - name: Delete existing snapshot version
      uses: ./.github/actions/cleanup-snapshot
      with:
        github_token: ${{ inputs.github_token }}
        branch_name: ${{ inputs.branch_name }}
    - name: Deploy snapshot to GitHub Package Registry
      shell: bash
      run: |
        if [[ "${ACT:-false}" == "true" ]]; then
          echo "Skipping deploy in local environment (ACT=true)"
        else
          ./gradlew publish -Pversion="${SNAPSHOT_VERSION}"
        fi
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ inputs.github_token }}