name: Trigger pipeline deploy

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

permissions: {}

jobs:
  semver_labels:
    name: Read semver labels from merged PR
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    outputs:
      semver_app: ${{ steps.semver_labels.outputs.semver_app }}
      skip_release: ${{ steps.semver_labels.outputs.skip_release }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/check-pr-semver-labels
        id: semver_labels
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
  azure-devops-deploy-pipeline:
    name: Trigger azure devops deploy pipeline
    if: ${{ needs.semver_labels.outputs.skip_release == 'false' }}
    runs-on: ubuntu-latest
    needs: semver_labels
    environment: prod
    steps:
      - name: Configure pipeline parameters
        id: configure_pipeline_parameters
        run: |
          echo "📝 Inputs"
          echo "Semver app: ${{ needs.semver_labels.outputs.semver_app }}"
          echo "RELEASE_SEMVER=${{ needs.semver_labels.outputs.semver_app }}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Log pipeline parameters
        run: |
          echo "🪛 Pipeline parameters"
          echo "RELEASE_SEMVER=${{ steps.configure_pipeline_parameters.outputs.RELEASE_SEMVER }}"
        shell: bash
      - name: Azure Pipelines Action
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/pipeline_response.json -w "%{http_code}" -X POST \
            -u ":${{ secrets.AZURE_DEVOPS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
                  "resources": {
                    "repositories": {
                      "self": {
                        "refName": "${{ github.ref }}"
                      }
                    }
                  },
                  "templateParameters": {
                    "RELEASE_SEMVER": "${{ steps.configure_pipeline_parameters.outputs.RELEASE_SEMVER }}"
                  }
                }' \
            "https://dev.azure.com/pagopaspa/pagoPA-projects/_apis/pipelines/2634/runs?api-version=7.0")
          echo "📄 Response body:"
          cat /tmp/pipeline_response.json
          echo ""
          echo "📡 HTTP status code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Failed to trigger Azure DevOps pipeline (HTTP status: $HTTP_STATUS)"
            exit 1
          fi

  skip_release:
    name: Skip release
    if: ${{ needs.semver_labels.outputs.skip_release == 'true' }}
    runs-on: ubuntu-latest
    needs: semver_labels
    steps:
      - name: Log skipped release
        run: echo "Release skipped because the merged PR has the skip-release label."